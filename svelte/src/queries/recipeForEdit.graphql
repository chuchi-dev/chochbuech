# a recipe of zipp as the start of a new one: "Make it your own" of
# someone else's recipe, without their photos (their own ones the editor
# reads from /members/entries, with the draft; the image is the preview of
# their live one)
query ($siteId: [QueryArgument], $id: [QueryArgument]) {
  recipe: entry(section: "recipes", siteId: $siteId, id: $id) {
    id
    title
    url
    ... on recipe_Entry {
      authorId
      serves
      totalTime
      activeTime
      source {
        url
      }
      category {
        id
      }
      image {
        id
        url(transform: "card")
        width(transform: "card")
        height(transform: "card")
      }
      chapters {
        ... on chapter_Block {
          title
          ingredients {
            amount
            unit
            name
          }
          steps {
            chunks {
              ... on Html {
                html
              }
            }
          }
        }
      }
    }
  }
}
