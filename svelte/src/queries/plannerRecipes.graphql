# the weekly planner: all recipes to pick from with their ingredients,
# the user's own ones by their author
query ($siteId: [QueryArgument]) {
  recipes: entries(
    section: "recipes"
    siteId: $siteId
    limit: 500
    orderBy: "title"
  ) {
    id
    title
    url
    ... on recipe_Entry {
      authorId
      serves
      chapters {
        ... on chapter_Block {
          ingredients {
            amount
            unit
            name
          }
        }
      }
    }
  }
}
