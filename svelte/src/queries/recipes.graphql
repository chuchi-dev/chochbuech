# the list of recipes: search, category filter, a cook's recipes ($author,
# a user id) and pages for Load More
query (
  $siteId: [QueryArgument]
  $search: String
  $category: [QueryArgument]
  $author: [QueryArgument]
  $limit: Int
  $offset: Int
) {
  recipes: entries(
    section: "recipes"
    siteId: $siteId
    search: $search
    category: $category
    authorId: $author
    limit: $limit
    offset: $offset
  ) {
    id
    title
    url
    slug
    postDate @formatDateTime(format: "F jS, Y")
    ... on recipe_Entry {
      rating
      category {
        id
        title
        slug
        ... on category_Entry {
          singular
        }
      }
      author {
        id
        name
        url
      }
      image {
        url(transform: "card")
        srcset(transforms: ["thumb", "card"])
        width(transform: "card")
        height(transform: "card")
        alt
      }
    }
  }
  total: entryCount(
    section: "recipes"
    siteId: $siteId
    search: $search
    category: $category
    authorId: $author
  )
}
