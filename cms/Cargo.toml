[package]
name = "chochbuech-cms"
version = "0.1.0"
edition = "2024"
publish = false

# zipp from feat/user-profiles until the public profiles of users (the
# cooks are the members, user fields and pages) are merged and released
[dependencies]
zipp = { package = "zipp-cms", git = "https://github.com/zipp-cms/zipp-next", branch = "feat/user-profiles" }
zipp-seo = { git = "https://github.com/zipp-cms/zipp-next", branch = "feat/user-profiles" }
zipp-members = { git = "https://github.com/zipp-cms/zipp-next", branch = "feat/user-profiles" }

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros"] }
zipp = { package = "zipp-cms", git = "https://github.com/zipp-cms/zipp-next", branch = "feat/user-profiles", features = ["testing"] }
