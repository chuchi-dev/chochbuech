[package]
name = "chochbuech-cms"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# zipp's main until its next release (required fields only to publish,
# for private recipes), then back to crates.io; Cargo.lock pins the rev
zipp = { package = "zipp-cms", git = "https://github.com/zipp-cms/zipp-next", branch = "main" }
zipp-seo = { git = "https://github.com/zipp-cms/zipp-next", branch = "main" }
zipp-members = { git = "https://github.com/zipp-cms/zipp-next", branch = "main" }
async-trait = "0.1"
reqwest = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.45", features = ["net", "time"] }
tracing = "0.1"
url = "2.5"

[dev-dependencies]
tokio = { version = "1.45", features = ["rt-multi-thread", "macros"] }
zipp = { package = "zipp-cms", git = "https://github.com/zipp-cms/zipp-next", branch = "main", features = ["testing"] }
