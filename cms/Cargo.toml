[package]
name = "chochbuech-cms"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
zipp = { package = "zipp-cms", version = "0.2" }
zipp-seo = "0.2"
zipp-members = "0.2"

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros"] }
zipp = { package = "zipp-cms", version = "0.2", features = ["testing"] }
