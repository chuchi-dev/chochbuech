[package]
name = "chochbuech-cms"
version = "0.1.0"
edition = "2024"
publish = false

# zipp from feat/members until the website logins (members, /site-auth)
# and zipp-members are merged to main and released
[dependencies]
zipp = { package = "zipp-cms", git = "https://github.com/zipp-cms/zipp-next", branch = "feat/members" }
zipp-seo = { git = "https://github.com/zipp-cms/zipp-next", branch = "feat/members" }
zipp-members = { git = "https://github.com/zipp-cms/zipp-next", branch = "feat/members" }

[dev-dependencies]
serde_json = "1.0"
tokio = { version = "1.45", features = ["rt-multi-thread", "macros"] }
zipp = { package = "zipp-cms", git = "https://github.com/zipp-cms/zipp-next", branch = "feat/members", features = ["testing"] }
